<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Chain Crypto Wallet | CoinGecko API</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1c2129; --muted: #6b7280; --line: #e5e7eb; --green: #1e9e3a; --red: #d93a3a; --brand: #4bcc00; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0 16px 0 0; }
    input, select, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
    input#address { width: 26rem; max-width: 100%; }
    button { background: var(--text); color: #fff; border: 0; cursor: pointer; }
    button.secondary { background: #fff; color: var(--text); border: 1px solid var(--line); }
    main { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; padding: 16px 24px; }
    main > div { min-width: 0; } /* let wide tables scroll inside their card */
    @media (max-width: 600px) { main, header { padding-left: 16px; padding-right: 16px; } }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    tr[data-coin] { cursor: pointer; }
    tr[data-coin]:hover { background: var(--bg); }
    td img, .dot { width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; margin-right: 6px; }
    .dot { display: inline-flex; align-items: center; justify-content: center; background: var(--line); font-size: 10px; font-weight: 700; color: var(--muted, #6b7280); }
    .total { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .total small { font-size: 13px; color: var(--muted); font-weight: 400; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
    .up { color: var(--green); } .down { color: var(--red); }
    .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .tag.buy, .tag.in { background: #e7f7ea; color: var(--green); }
    .tag.sell, .tag.out { background: #fdeaea; color: var(--red); }
    .note { background: #fff8e1; border: 1px solid #f3d36b; padding: 8px 12px; border-radius: 8px; }
    .error { color: var(--red); }
    code { font-size: 12px; word-break: break-all; }
    .stack > * + * { margin-top: 8px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Multi-Chain Wallet</h1>
    <input id="address" placeholder="Wallet address (0x…)" aria-label="Wallet address">
    <button id="load">Load wallet</button>
  </header>

  <main>
    <div class="stack">
      <section><h2>Portfolio</h2><div id="portfolio"></div></section>
      <section>
        <h2>Activity <select id="activity-network" aria-label="Network" autocomplete="off"></select></h2>
        <div id="activity"></div>
      </section>
      <section><h2>Profit and loss</h2><div id="pnl"></div></section>
    </div>

    <div class="stack">
      <section><h2 id="chart-title">Token detail</h2><canvas id="chart" height="220"></canvas></section>
      <section class="stack">
        <h2>Your wallet (Sepolia testnet)</h2>
        <button id="create">Create new wallet</button>
        <div><input id="import-key" type="password" placeholder="Or paste a test private key"> <button id="import" class="secondary">Import</button></div>
        <p>Receive at: <code id="my-address">–</code></p>
        <p id="backup" class="note">Your private key is created in this browser tab and is never sent to the server.</p>
        <p>Balance: <span id="sepolia-balance">–</span></p>
        <h2>Send</h2>
        <input id="send-to" placeholder="Recipient address (0x…)">
        <input id="send-amount" placeholder="Amount in ETH" value="0.001">
        <button id="send">Sign and send</button>
        <p id="send-result"></p>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='wallet.js') }}"></script>
</body>
</html>
