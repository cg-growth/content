<!doctype html>
<html lang="en" class="dark tw-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet Profile</title>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/moon.js?v=20260924d"></script>
  <link rel="stylesheet" href="/moon.css?v=20260924d">
  <link rel="icon" href="/brand-logo.svg?v=20260924e" type="image/svg+xml">
</head>
<body class="tw-font-gecko-body tw-bg-white dark:tw-bg-moon-900 tw-text-gray-900 dark:tw-text-moon-50 tw-min-h-screen tw-flex tw-flex-col">
  <header class="tw-border-b tw-border-gray-200 dark:tw-border-moon-700 tw-bg-white dark:tw-bg-moon-900 tw-sticky tw-top-0 tw-z-30">
    <div class="tw-max-w-[1600px] tw-mx-auto tw-px-4 tw-py-3 tw-flex tw-flex-wrap tw-items-center tw-gap-x-5 tw-gap-y-3">
      <a id="backLink" class="tw-hidden tw-text-sm tw-font-semibold tw-text-gray-500 dark:tw-text-moon-200 hover:tw-text-gray-900 dark:hover:tw-text-moon-50"></a>
      <div class="tw-flex tw-items-center tw-gap-3">
        <a href="/" title="All demos" class="tw-shrink-0 hover:tw-opacity-80 tw-transition-opacity"><img src="/brand-logo.svg?v=20260924e" alt="Demos home" class="tw-w-9 tw-h-9"></a>
        <div>
          <div class="tw-text-lg tw-leading-7 tw-font-bold">Wallet Profile</div>
          <div class="tw-text-xs tw-leading-4 tw-font-medium tw-text-gray-500 dark:tw-text-moon-200">Any wallet, profiled and labelled by Jev from multi-chain on-chain data</div>
        </div>
      </div>
      <form id="addrForm" class="tw-flex tw-items-center tw-gap-2 tw-w-full md:tw-w-auto">
        <div class="tw-overflow-hidden tw-flex tw-items-center tw-bg-white dark:tw-bg-moon-900 tw-gap-x-1 tw-rounded-lg tw-ring-2 tw-ring-gray-200 dark:tw-ring-moon-600 focus-within:tw-ring-primary-500 dark:focus-within:tw-ring-primary-400 tw-w-full md:tw-w-[460px]">
          <span class="tw-pl-3 tw-text-gray-400 dark:tw-text-moon-400">⌕</span>
          <input id="addrInput" autocomplete="off" spellcheck="false" placeholder="Paste a wallet address (0x…)" class="tw-flex-1 tw-bg-transparent tw-border-0 tw-p-0 tw-pl-1 tw-pr-2 tw-text-gray-900 dark:tw-text-moon-50 tw-text-sm tw-font-mono tw-w-full tw-h-10 placeholder:tw-text-gray-400 dark:placeholder:tw-text-moon-500 focus:tw-ring-0 focus-visible:tw-outline-none">
        </div>
        <div id="chainSel"></div>
        <button id="goBtn" type="submit"></button>
      </form>
      <a href="/radar.html" class="tw-ml-auto tw-text-sm tw-font-semibold tw-text-gray-500 dark:tw-text-moon-200 hover:tw-text-gray-900 dark:hover:tw-text-moon-50">Smart Money Radar →</a>
    </div>
  </header>

  <main class="tw-flex-1 tw-max-w-[1600px] tw-w-full tw-mx-auto tw-px-4 tw-py-5 tw-space-y-4">
    <section id="emptyView"></section>
    <section id="summary" class="tw-hidden"></section>
    <section id="tabs" class="tw-hidden tw-rounded-xl tw-border tw-border-gray-200 dark:tw-border-moon-700 tw-bg-white dark:tw-bg-moon-800">
      <div id="tabBar" class="tw-flex tw-gap-6 tw-px-5 tw-border-b tw-border-gray-200 dark:tw-border-moon-700"></div>
      <div id="tabBody" class="tw-overflow-x-auto"></div>
    </section>
  </main>

  <footer class="tw-border-t tw-border-gray-200 dark:tw-border-moon-700">
    <div class="tw-max-w-[1600px] tw-mx-auto tw-px-4 tw-py-3 tw-flex tw-flex-wrap tw-items-center tw-gap-4 tw-text-xs tw-leading-4 tw-text-gray-500 dark:tw-text-moon-300">
      <span>Behaviour labels generated by Jev from <a href="https://www.coingecko.com/en/api" target="_blank" rel="noopener" class="tw-text-gray-900 dark:tw-text-moon-50 hover:tw-underline tw-font-semibold">CoinGecko API</a> on-chain wallet data · labels describe behaviour, not identity</span>
      <span class="tw-ml-auto tw-flex tw-items-center tw-gap-2"><a href="https://www.coingecko.com/en/api" target="_blank" rel="noopener" class="tw-inline-flex tw-items-center tw-gap-2 tw-font-semibold tw-text-gray-500 dark:tw-text-moon-200 hover:tw-text-gray-900 dark:hover:tw-text-moon-50"><img src="/coingecko-api-logo.ico" alt="CoinGecko" class="tw-w-5 tw-h-5 tw-rounded-full"><span>Data powered by <span class="tw-text-gray-900 dark:tw-text-moon-50">CoinGecko API</span></span></a><span class="tw-font-semibold">· scored by <img src="/typesafe-logo.png?v=20260924d" alt="TypeSafe" class="tw-inline-block tw-w-4 tw-h-4 tw-rounded-full tw-align-[-3px]"> Jev</span></span>
      <span id="devBar" data-dev class="tw-flex tw-items-center tw-gap-2"></span>
    </div>
  </footer>
  <script src="/wallet.js?v=20260924d"></script>
</body>
</html>
